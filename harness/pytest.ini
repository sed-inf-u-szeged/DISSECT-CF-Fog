[pytest]
# Run as: py -3.12 -m pytest    (from the harness/ directory)
# or:     py -3.12 -m pytest harness/   (from the project root)
#
# The flrng module sits at harness/flrng.py; tests import it as `from flrng import ...`.
# Pointing pytest at the harness/ root and adding it to sys.path keeps the
# import flat and matches how the Pass-2 modes will use it.
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
filterwarnings =
    error
